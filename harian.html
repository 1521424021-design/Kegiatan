<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kegiatan Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .completed { text-decoration: line-through; color: #9ca3af; }
        /* Styling untuk Jam dan Tanggal sesuai dokumen praktikum */
.jam-container {
    text-align: center;
    margin-bottom: 20px;
    padding: 15px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 8px;
    color: white;
}

.jam {
    font-size: 2.5rem;
    font-weight: bold;
    margin: 0;
}
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Kegiatan Hari Ini</h1>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="todoInput" placeholder="Tambah kegiatan baru..." 
                class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addTask()" 
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                Tambah
            </button>
        </div>

        <ul id="todoList" class="space-y-3">
            </ul>
    </div>

    <script>
        const input = document.getElementById('todoInput');
        const list = document.getElementById('todoList');

        // Fungsi Tambah Tugas
        function addTask() {
            const text = input.value.trim();
            if (text === "") return;

            const li = document.createElement('li');
            li.className = "flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 animate-fade-in";
            
            li.innerHTML = `
                <div class="flex items-center gap-3 cursor-pointer" onclick="toggleTask(this)">
                    <input type="checkbox" class="w-4 h-4 accent-blue-600">
                    <span class="text-slate-700">${text}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 font-bold px-2">
                    &times;
                </button>
            `;

            list.appendChild(li);
            input.value = ""; // Reset input
        }

        // Fungsi Coret Tugas (Selesai)
        function toggleTask(element) {
            const span = element.querySelector('span');
            const checkbox = element.querySelector('input');
            span.classList.toggle('completed');
            checkbox.checked = !checkbox.checked;
        }

 // Menambah tugas dengan tombol Enter
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });    
    </script>
</body>
</html>
